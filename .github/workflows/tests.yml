name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      # The Java integration tests are skipped here because they need an
      # OpenRocket jar (set OPENROCKET_JAR to run them locally).
      - name: Run tests
        run: python -m unittest discover -s tests -v

  package:
    name: Build and check package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Sample rocket is packaged
        run: unzip -l dist/*.whl | grep orhelper/data/simple.ork
