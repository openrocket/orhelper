[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orhelper"
version = "0.1.6"
description = "Script and automate OpenRocket simulations from Python."
readme = "README.md"
license = { text = "GPL-2.0-only" }
authors = [{ name = "Andrei Popescu and others" }]
keywords = ["openrocket", "rocketry", "simulation", "jpype", "aerospace"]
requires-python = ">=3.9"
dependencies = [
    "jpype1>=1.3",
    "numpy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Java",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
examples = ["matplotlib", "scipy"]
pandas = ["pandas"]

[project.urls]
Homepage = "https://github.com/openrocket/orhelper"
Source = "https://github.com/openrocket/orhelper"
Issues = "https://github.com/openrocket/orhelper/issues"
Documentation = "https://github.com/openrocket/openrocket/wiki/Scripting-with-Python-and-JPype"

[tool.setuptools.packages.find]
include = ["orhelper*"]

[tool.setuptools.package-data]
orhelper = ["data/*.ork"]
